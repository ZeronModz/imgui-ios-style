name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install NDK
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" "build-tools;34.0.0" "platforms;android-34" 2>&1 | tail -5
        echo "NDK_PATH=$(ls -d $ANDROID_HOME/ndk/*/ | head -1)" >> $GITHUB_ENV

    - name: Build .so
      run: |
        mkdir -p android/build
        cd android/build
        cmake \
          -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-24 \
          -DANDROID_STL=c++_shared \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_LIBRARY_OUTPUT_DIRECTORY=$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a \
          ../app/src/main/jni
        make -j$(nproc)

    - name: Build APK
      run: |
        JAR=$(find $ANDROID_HOME/platforms -name "android.jar" | head -1)
        BT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
        SRC=android/app/src/main
        OUT=android/out
        mkdir -p $OUT/gen $OUT/classes

        ${BT}aapt package -f -m -S $SRC/res -J $OUT/gen -M $SRC/AndroidManifest.xml -I $JAR
        javac -source 17 -target 17 -classpath $JAR -d $OUT/classes $OUT/gen/com/menu/R.java $SRC/java/com/menu/MainActivity.java
        ${BT}d8 --output $OUT --lib $JAR $OUT/classes/com/menu/*.class
        ${BT}aapt package -f -M $SRC/AndroidManifest.xml -S $SRC/res -I $JAR -F $OUT/app.apk
        cd $OUT && zip -j app.apk classes.dex && cd $GITHUB_WORKSPACE
        cd $SRC && zip -r $GITHUB_WORKSPACE/$OUT/app.apk jniLibs/ && cd $GITHUB_WORKSPACE
        keytool -genkeypair -keystore $OUT/debug.keystore -storepass android -alias key -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug" 2>/dev/null
        ${BT}apksigner sign --ks $OUT/debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias key --out ios-menu.apk $OUT/app.apk
        ls -lh ios-menu.apk

    - uses: actions/upload-artifact@v4
      with:
        name: ios-menu-apk
        path: ios-menu.apk
