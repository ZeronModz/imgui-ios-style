name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install NDK
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME"
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
        ls $ANDROID_HOME/cmdline-tools/latest/bin/ 2>/dev/null || echo "no cmdline-tools"
        ls $ANDROID_HOME/ 2>/dev/null
        # Use sdkmanager directly
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" "build-tools;34.0.0" "platforms;android-34" 2>&1 || \
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34" 2>&1 || true
        echo "NDK_HOME=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | head -1)" >> $GITHUB_ENV

    - name: Find NDK path
      run: |
        echo "Available NDKs:"
        ls -la $ANDROID_HOME/ndk/ 2>/dev/null || echo "No NDK dir"
        NDK_PATH=$(ls -d $ANDROID_HOME/ndk/*/ 2>/dev/null | head -1)
        echo "NDK_PATH=$NDK_PATH" >> $GITHUB_ENV
        echo "Using NDK: $NDK_PATH"
        ls "$NDK_PATH/build/cmake/android.toolchain.cmake" 2>/dev/null || echo "No toolchain file"

    - name: Build native .so
      run: |
        echo "NDK_PATH=$NDK_PATH"
        TOOLCHAIN=$NDK_PATH/build/cmake/android.toolchain.cmake
        
        mkdir -p android/jni_build
        cd android/jni_build
        
        cmake \
          -DCMAKE_TOOLCHAIN_FILE=$TOOLCHAIN \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-24 \
          -DANDROID_STL=c++_shared \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_LIBRARY_OUTPUT_DIRECTORY=$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a \
          $GITHUB_WORKSPACE/android/app/src/main/jni
          
        make -j$(nproc)

    - name: Verify .so
      run: |
        ls -lh android/app/src/main/jniLibs/arm64-v8a/libimgui_ios.so
        file android/app/src/main/jniLibs/arm64-v8a/libimgui_ios.so

    - name: Build APK
      run: |
        ANDROID_JAR=$(find $ANDROID_HOME/platforms -name "android.jar" | head -1)
        BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
        echo "Android JAR: $ANDROID_JAR"
        echo "Build Tools: $BUILD_TOOLS"
        
        SRC=android/app/src/main
        BUILD_DIR=android/build_apk
        
        mkdir -p $BUILD_DIR/gen $BUILD_DIR/classes
        
        # Generate R.java
        ${BUILD_TOOLS}aapt package -f -m \
          -S $SRC/res \
          -J $BUILD_DIR/gen \
          -M $SRC/AndroidManifest.xml \
          -I $ANDROID_JAR
        
        # Compile Java
        javac -source 17 -target 17 \
          -classpath $ANDROID_JAR \
          -d $BUILD_DIR/classes \
          $BUILD_DIR/gen/com/imgui/iosstyle/R.java \
          $SRC/java/com/imgui/iosstyle/MainActivity.java
        
        # DEX
        ${BUILD_TOOLS}d8 --output $BUILD_DIR \
          --lib $ANDROID_JAR \
          $BUILD_DIR/classes/com/imgui/iosstyle/*.class
        
        # Package resources
        ${BUILD_TOOLS}aapt package -f \
          -M $SRC/AndroidManifest.xml \
          -S $SRC/res \
          -I $ANDROID_JAR \
          -F $BUILD_DIR/app.unsigned.apk
        
        # Add DEX and native libs
        cd $BUILD_DIR
        zip -j app.unsigned.apk classes.dex
        cd $GITHUB_WORKSPACE
        cd $SRC
        zip -r $GITHUB_WORKSPACE/$BUILD_DIR/app.unsigned.apk jniLibs/
        cd $GITHUB_WORKSPACE
        
        # Generate keystore
        keytool -genkeypair -v \
          -keystore $BUILD_DIR/debug.keystore \
          -storepass android \
          -alias androiddebugkey \
          -keypass android \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -dname "CN=Debug,OU=Debug,O=Debug,L=Debug,S=Debug,C=US"
        
        # Sign
        ${BUILD_TOOLS}apksigner sign \
          --ks $BUILD_DIR/debug.keystore \
          --ks-pass pass:android \
          --key-pass pass:android \
          --ks-key-alias androiddebugkey \
          --out $GITHUB_WORKSPACE/ios-style.apk \
          $BUILD_DIR/app.unsigned.apk
        
        # Verify
        ${BUILD_TOOLS}apksigner verify $GITHUB_WORKSPACE/ios-style.apk
        ls -lh $GITHUB_WORKSPACE/ios-style.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ios-style-apk
        path: ios-style.apk
        retention-days: 30
